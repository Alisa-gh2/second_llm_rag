version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: llama3.2:3b
      CLEAN_DOCS_DIR: /app/clean_docs
      INDEX_DIR: /app/faiss_index
      LOG_DIR: /app/logs
    volumes:
      # монтируем папки с данными (не копируем их в образ)
      - ./clean_docs:/app/clean_docs
      - ./faiss_index:/app/faiss_index
      - ./logs:/app/logs
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
